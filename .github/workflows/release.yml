# A release's binaries, built on each platform PPA supports (the same six as
# CI): the ppa command and libppa (the C library and 7-Zip plugin), checked first by .github/test.sh (every sample of the
# repository back byte for byte, the layer tests, ppa selftest), then packed
# and uploaded to the GitHub release of the tag, which is made if it does
# not exist yet, with SHA256SUMS of every file it then holds. As PJA's
# release.yml.
#
# A tag v* runs it; for a tag that already exists, run it by hand with the
# tag's name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to build, as v0.2.0'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # clang where it is at hand: its C is faster, with the same bytes
          - { platform: linux-x86_64, os: ubuntu-24.04, cc: clang }
          - { platform: linux-x86, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, cc: clang }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: windows-x64, os: windows-latest, fpc: fpc -Px86_64, cc: /c/msys64/mingw64/bin/gcc, gcc: mingw-w64-x86_64-gcc }
          - { platform: windows-x86, os: windows-latest, fpc: fpc -Pi386, cc: /c/msys64/mingw32/bin/gcc, gcc: mingw-w64-i686-gcc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Free Pascal (Linux)
        if: runner.os == 'Linux' && matrix.platform != 'linux-x86'
        run: sudo apt-get update && sudo apt-get install -y fpc clang
      - name: Install the 32-bit Free Pascal (Linux x86)
        if: matrix.platform == 'linux-x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 gcc-multilib
          scripts/fpc-i386.sh /tmp/fpc-i386
      - name: Install Free Pascal (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc
      - name: Install Free Pascal (win32 and win64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - name: Install the C compiler (MSYS2's MinGW-w64 gcc)
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed ${{ matrix.gcc }}
      - name: The 32-bit 7-Zip, for the 32-bit plugin
        if: matrix.platform == 'windows-x86'
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o "$env:TEMP\7z32.exe" https://www.7-zip.org/a/7z2501.exe
          & 'C:\Program Files\7-Zip\7z.exe' x -y -bso0 "-oC:\7z32" "$env:TEMP\7z32.exe"
      - name: Build and check
        shell: bash
        env:
          SEVEN32: ${{ matrix.platform == 'windows-x86' && '/c/7z32' || '' }}
          FPC: ${{ matrix.platform == 'linux-x86' && '/tmp/fpc-i386/fpc' || matrix.fpc || 'fpc' }}
          CC: ${{ matrix.platform == 'linux-x86' && 'gcc -m32' || matrix.cc || 'cc' }}
          PPA_OUT: build/rel
        run: |
          export PPA_COMMIT=$(git rev-parse --short=7 HEAD)
          sh .github/test.sh
      - name: Pack
        shell: bash
        run: |
          V=${TAG#v}; P=${{ matrix.platform }}
          case $P in windows-*) EXE=.exe ;; *) EXE= ;; esac
          case $P in windows-*) LIB=ppa.dll ;; macos-*) LIB=ppa.dylib ;; *) LIB=ppa.so ;; esac
          CLI=ppa-$V-$P; LIBP=ppa-$V-lib-$P
          mkdir -p dist "$CLI" "$LIBP"
          cp build/rel/ppa$EXE README.md LICENSE NOTICE doc/CLI.md "$CLI/"
          # libppa: the C library and 7-Zip / 7-Zip-zstd plugin
          cp build/rel/lib/$LIB pas/lib/ppa.h doc/LIBRARY.md LICENSE NOTICE "$LIBP/"
          # PJA's codec is inside (a JNG's JPEG): its license and notices
          for d in "$CLI" "$LIBP"; do
            cp vendor/pja/LICENSE "$d/LICENSE-PJA"
            cp vendor/pja/NOTICE "$d/NOTICE-PJA"
          done
          for d in "$CLI" "$LIBP"; do
            case $P in
              windows-*) 7z a -tzip -bso0 "dist/$d.zip" "$d" ;;
              macos-*) tar --uid 0 --gid 0 -czf "dist/$d.tar.gz" "$d" ;;
              *) tar --owner=0 --group=0 -czf "dist/$d.tar.gz" "$d" ;;
            esac
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.platform }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.platform }}
          path: hash.txt

  # the same streams and files on every platform, as CI's last job checks:
  # the tag's own CI run may have been cancelled by a newer push
  determinism:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
      - name: Compare the hashes
        run: |
          for f in hash-*/*; do echo "$f: $(cat "$f" | tr '\n' ' ')"; done
          n=$(for f in hash-*/*; do tr -d '\r' < "$f" | cksum; done | sort -u | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "the platforms found different things" >&2
            exit 1
          fi
          echo "the same on every platform"

  publish:
    needs: [build, determinism]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          merge-multiple: true
          path: dist
      # the sources to vendor, untouched: the zpaq-std plugin (zpaq-std
      # builds ppa1 from them) and PPA's codec for other programs (POA, PDA)
      - name: The vendor tarball
        run: |
          tools/zpaqstd_tarball.sh vtar "$TAG"
          cp vtar/ppa-*-zpaqstd.tar.gz dist/
      - name: Upload to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "PPA ${TAG#v}" \
                 --notes "PPA ${TAG#v}. The formats are not frozen before 0.9.0: every later release reads what this one writes, but a file a later release writes may not open in this one. The Linux builds need glibc 2.34 or later (Debian 12, Ubuntu 22.04, RHEL 9 and newer)."
          gh release upload "$TAG" dist/* --clobber
          mkdir all
          gh release download "$TAG" --dir all --pattern 'ppa-*'
          (cd all && sha256sum ppa-* > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" all/SHA256SUMS --clobber
