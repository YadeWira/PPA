name: Bug report
description: Something PPA did wrong, refused, or crashed on
title: "ppa: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The quickest way to a fix is the output of
        `ppa report FILE` (on the file it happened with): it has PPA's build, the
        system and the file's structure, and **not** the image, its metadata
        contents or folder names. `ppa report` prints a link that opens this form
        with the report filled in below.
  - type: textarea
    id: body
    attributes:
      label: The output of ppa report
      description: Run `ppa report FILE` (or `ppa report` without a file) and paste all of it.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The exact command line(s), and what it printed.
      placeholder: |
        ppa a image.png
        ppa: image.png: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file (if you can share it)
      description: |
        `ppa report --with-file FILE` puts a copy beside the report. GitHub takes a .png
        as it is; zip a .mng, .jng or .ppa first. Only attach what you are free to share.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`ppa selftest` passes on this machine (if it fails, say so above)"
          required: false
